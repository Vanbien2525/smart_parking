services:
  - type: web
    name: smart-parking-server
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements-server.txt
    startCommand: uvicorn server.gateway:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SERVER_HOST
        value: 127.0.0.1
      - key: SERVER_PORT
        value: 5555
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: smart_parking
      - key: DB_USER
        value: neondb_owner
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: DB_CHANNEL_BINDING
        value: require
      - key: DB_CONNECT_TIMEOUT
        value: 15
      - key: DB_POOL_MIN
        value: 2
      - key: DB_POOL_MAX
        value: 10
      - key: DB_POOL_TIMEOUT
        value: 30
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
